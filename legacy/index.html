<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechVault • Computer Shop Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#e5e8f1',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-black text-slate-800 antialiased">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col shadow-sm z-20">
      <div class="p-5 border-b border-slate-100">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white shadow-lg shadow-brand-500/30">
            <i class="fas fa-laptop text-lg"></i>
          </div>
          <div>
            <h1 class="font-bold text-lg leading-tight text-slate-900">TechVault</h1>
            <p class="text-xs text-slate-500">Inventory System</p>
          </div>
        </div>
      </div>

      <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
        <p class="px-3 text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-2">Main</p>
        <a href="#" data-page="dashboard" class="sidebar-link active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
          <i class="fas fa-chart-pie w-5 text-center"></i> Dashboard
        </a>
        <a href="#" data-page="products" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 transition-colors">
          <i class="fas fa-box w-5 text-center"></i> Products
        </a>
        <a href="#" data-page="categories" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 transition-colors">
          <i class="fas fa-tags w-5 text-center"></i> Categories
        </a>
        <a href="#" data-page="inventory" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 transition-colors">
          <i class="fas fa-warehouse w-5 text-center"></i> Stock In / Out
        </a>

        <p class="px-3 text-[10px] font-semibold text-slate-400 uppercase tracking-wider mt-5 mb-2">Procurement</p>
        <a href="#" data-page="suppliers" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 transition-colors">
          <i class="fas fa-truck w-5 text-center"></i> Suppliers
        </a>
        <a href="#" data-page="purchasing" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 transition-colors">
          <i class="fas fa-shopping-cart w-5 text-center"></i> Purchasing
        </a>

        <p class="px-3 text-[10px] font-semibold text-slate-400 uppercase tracking-wider mt-5 mb-2">Sales</p>
        <a href="#" data-page="sales" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 transition-colors">
          <i class="fas fa-receipt w-5 text-center"></i> Sales
        </a>
        <a href="#" data-page="customers" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 transition-colors">
          <i class="fas fa-users w-5 text-center"></i> Customers
        </a>
        <a href="#" data-page="warranty" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 transition-colors">
          <i class="fas fa-shield-alt w-5 text-center"></i> Warranty
        </a>

        <p class="px-3 text-[10px] font-semibold text-slate-400 uppercase tracking-wider mt-5 mb-2">System</p>
        <a href="#" data-page="reports" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 transition-colors">
          <i class="fas fa-chart-bar w-5 text-center"></i> Reports
        </a>
        <a href="#" data-page="users" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 transition-colors">
          <i class="fas fa-user-cog w-5 text-center"></i> User Management
        </a>
      </nav>

      <div class="p-4 border-t border-slate-100">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-brand-100 text-brand-700 flex items-center justify-center font-semibold text-sm">AD</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium truncate">Admin User</p>
            <p class="text-xs text-slate-500 truncate">admin@techvault.com</p>
          </div>
          <button class="text-slate-400 hover:text-slate-600" title="Logout" onclick="showToast('Logout is not available in this demo')"><i class="fas fa-sign-out-alt"></i></button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Top Bar -->
      <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 shadow-sm z-10">
        <div class="flex items-center gap-4">
          <button id="menuToggle" class="lg:hidden text-slate-500 hover:text-slate-700">
            <i class="fas fa-bars text-lg"></i>
          </button>
          <div>
            <h2 id="pageTitle" class="text-lg font-semibold text-slate-900">Dashboard</h2>
            <p id="pageSubtitle" class="text-xs text-slate-500">Overview of your computer shop</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="relative hidden md:block">
            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="globalSearch" placeholder="Search products, SKUs..." class="pl-9 pr-4 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent w-64 bg-slate-50" />
          </div>
          <button class="relative p-2 text-slate-500 hover:text-slate-700 hover:bg-slate-100 rounded-lg" onclick="showToast('You have no new notifications')">
            <i class="fas fa-bell"></i>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>
          <button class="p-2 text-slate-500 hover:text-slate-700 hover:bg-slate-100 rounded-lg" onclick="showToast('Settings are not available in this demo')">
            <i class="fas fa-cog"></i>
          </button>
        </div>
      </header>

      <!-- Page Content -->
      <main id="content" class="flex-1 overflow-y-auto p-6">
        <!-- Pages will be injected here -->
      </main>
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modalRoot" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
    <div id="modalContent" class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 hidden">
    <div class="bg-slate-900 text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm">
      <i class="fas fa-check-circle text-emerald-400"></i>
      <span id="toastMsg">Action completed</span>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
